name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --ignore=tests/test_godot.py

  godot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [default, godot-floor]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: >-
          nix develop .#${{ matrix.shell }} --command uv run pytest
          tests/test_godot.py tests/test_linkml_cli.py tests/test_viewer.py -s
