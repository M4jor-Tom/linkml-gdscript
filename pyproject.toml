[project]
name = "linkml-gdscript"
version = "0.1.0"
description = "Generate GDScript (Godot 4) classes from LinkML schemas"
readme = "README.md"
license = "MIT"
authors = [{ name = "theta" }]
requires-python = ">=3.10"
dependencies = [
    "linkml>=1.12.1",
]

[project.scripts]
gen-gdscript = "linkml_gdscript.generator:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

# Same rule set as linkml/linkml, so the code can move upstream unchanged.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-ignore = ["E203"]
select = ["E", "F", "I", "UP"]
